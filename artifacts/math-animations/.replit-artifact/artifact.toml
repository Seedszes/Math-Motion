kind = "web"
previewPath = "/"
title = "Math Animations"
version = "1.0.0"
id = "artifacts/math-animations"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23907

[services.development]
run = "pnpm --filter @workspace/math-animations run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/math-animations", "run", "build" ]
publicDir = "artifacts/math-animations/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23907"
BASE_PATH = "/"
